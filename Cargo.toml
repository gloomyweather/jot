[package]
name = "jot"
version = "0.1.0"
edition = "2021"
authors = ["gloomyweather"]
description = "quick notes for the terminal"
repository = "https://github.com/gloomyweather/jot"
license = "GPL-3.0"
keywords = ["notes", "tui", "terminal", "omarchy", "ratatui"]
categories = ["command-line-utilities"]
readme = "README.md"

[dependencies]
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
toml = "0.8"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
